<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
  <title id="title">What-if Studio</title>
  <desc id="desc">A film frame with a branching what-if spark</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe7a0"/>
      <stop offset=".45" stop-color="#d5a94d"/>
      <stop offset="1" stop-color="#8d5d19"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1">
      <stop stop-color="#191919"/>
      <stop offset="1" stop-color="#343434"/>
    </linearGradient>
  </defs>
  <rect width="640" height="180" rx="30" fill="#0d0d0d"/>
  <rect x="22" y="22" width="136" height="136" rx="24" fill="url(#ink)" stroke="url(#gold)" stroke-width="4"/>
  <g fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 72h76M52 108h50"/>
    <path d="M108 108l20-20-20-20"/>
  </g>
  <circle cx="110" cy="108" r="6" fill="#fff2c6"/>
  <text x="188" y="91" fill="#fff8e7" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="1">What-if</text>
  <text x="191" y="130" fill="url(#gold)" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600" letter-spacing="8">STUDIO</text>
</svg>
